<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer Rim / Turntable Platter -->
  <circle cx="32" cy="32" r="30" fill="#141210" stroke="#4a3e32" stroke-width="2.5"/>
  
  <!-- Subtle Vinyl Sound Grooves -->
  <circle cx="32" cy="32" r="23" stroke="#d4b483" stroke-width="1" stroke-opacity="0.28" stroke-dasharray="2 2"/>
  <circle cx="32" cy="32" r="17" stroke="#d4b483" stroke-width="1" stroke-opacity="0.38"/>
  <circle cx="32" cy="32" r="11" stroke="#d4b483" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="3 1.5"/>

  <!-- Dial Tick Notches (3, 6, 9 o'clock) -->
  <line x1="52" y1="32" x2="57" y2="32" stroke="#d4b483" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
  <line x1="32" y1="52" x2="32" y2="57" stroke="#d4b483" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
  <line x1="7" y1="32" x2="12" y2="32" stroke="#d4b483" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Center Spindle Hub -->
  <circle cx="32" cy="32" r="5" fill="#241e18" stroke="#d4b483" stroke-width="2.2"/>
  <circle cx="32" cy="32" r="1.5" fill="#f5ede0"/>

  <!-- Glowing 12 O'Clock Precision Pointer (Winning Roulette Indicator) -->
  <path d="M32 5 L36.5 15 L27.5 15 Z" fill="url(#pointerGold)" stroke="#fdfbf7" stroke-width="1" stroke-linejoin="round"/>
  <circle cx="32" cy="5" r="1.8" fill="#ffffff"/>

  <defs>
    <linearGradient id="pointerGold" x1="32" y1="5" x2="32" y2="15" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#f5ede0"/>
      <stop offset="0.8" stop-color="#d4b483"/>
      <stop offset="1" stop-color="#9a7b4f"/>
    </linearGradient>
  </defs>
</svg>